name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: training
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/training?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/training?schema=public
      SESSION_SECRET: ci-only-session-secret-0123456789abcdef
      CRON_SECRET: ci-only-cron-secret-0123456789
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Applies every migration to an empty DB — catches broken hand-written SQL.
      - name: Apply migrations
        run: npx prisma migrate deploy

      # Fails if schema.prisma has changes without a matching migration.
      - name: Schema matches migrations
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Seed
        run: npx prisma db seed

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint . --max-warnings=0

      - name: Unit tests
        run: npm test

      - name: Build
        run: npx next build
